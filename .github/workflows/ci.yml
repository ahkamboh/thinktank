name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite needs Node >= 22.5 (see "engines" in package.json).
        node: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Version comes from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      # packages/core tests download Xenova/all-MiniLM-L6-v2 through
      # @huggingface/transformers into MemoryStore's default model cache.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.thinktank/models
          key: thinktank-models-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: thinktank-models-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
